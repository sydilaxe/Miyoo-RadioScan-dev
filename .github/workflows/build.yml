name: build

on:
  push:
  pull_request:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Publish a GitHub release with this tag (e.g. v0.1.0). Leave empty to just build."
        required: false
        default: ""

jobs:
  miyoo:
    name: Miyoo Mini Plus package
    runs-on: ubuntu-latest
    container: aemiii91/miyoomini-toolchain:latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          make package \
            CROSS=/opt/miyoomini-toolchain/usr/bin/arm-linux-gnueabihf- \
            SYSROOT=/opt/miyoomini-toolchain/usr/arm-linux-gnueabihf/sysroot
      - uses: actions/upload-artifact@v4
        with:
          name: RadioScan-miyoo
          path: dist/RadioScan/
      - uses: actions/upload-artifact@v4
        with:
          name: RadioScan-zip
          path: dist/RadioScan.zip

  release:
    name: Publish release
    # runs for: a pushed v* tag, a release created on the website, or a manual run with a tag filled in
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release' || inputs.release_tag != ''
    needs: [miyoo, desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: RadioScan-zip
      - name: Create GitHub release with the Miyoo package
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag || github.event.release.tag_name || github.ref_name }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" RadioScan.zip --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" RadioScan.zip \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "RadioScan $TAG" \
              --notes-file .github/release-notes.md \
              --latest
          fi

  desktop:
    name: Desktop build + offline test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libsdl1.2-dev python3-numpy && pip install lameenc
      - run: make
      - name: Stream + synth test against a local fake Icecast server
        run: |
          python3 tools/fake_icecast.py --port 8765 &
          for i in $(seq 1 60); do curl -s -o /dev/null http://127.0.0.1:8765/list.pls && break; sleep 1; done
          mkdir -p t && cp App/RadioScan/cacert.pem t/
          printf 'Speech|http://127.0.0.1:8765/list.pls|voice\nMusic|http://127.0.0.1:8765/redirect|music\n' > t/stations.txt
          RADIOSCAN_DIR=t ./build/desktop/radioscan --render 8 t/out.wav 2>&1 | tee t/log.txt
          # one voice gets the talk stream and the other the music stream
          grep -q "voice sense .* (voice)" t/log.txt
          grep -q "voice sense .* (music)" t/log.txt
          # mono + clock: the radio on the left, 2 PPQN pulses at 120 BPM on the right, nothing else there
          RADIOSCAN_DIR=t ./build/desktop/radioscan --render 6 t/clock.wav output=1 bpm=120 clock_ppqn=1 2>/dev/null
          python3 tools/clockcheck.py t/clock.wav right | tee t/clock.txt
          grep -Eq "clock out on the right: 24 pulses, mean gap 250.00 ms, width 5.0.* ms, other values 0, sound peak (0\.[1-9]|1)" t/clock.txt
          RS_FAST=1 RADIOSCAN_DIR=t ./build/desktop/radioscan --render 2 t/clock24.wav output=1 bpm=120 clock_ppqn=5 clock_side=1 2>/dev/null
          python3 tools/clockcheck.py t/clock24.wav left | tee t/clock24.txt
          grep -q "clock out on the left: 96 pulses, mean gap 20.83 ms, .* other values 0" t/clock24.txt
      - name: Wi-Fi sync test (two units on this machine)
        run: |
          ./build/desktop/radioscan --synctest LEAD 97 6 > lead.txt &
          sleep 0.5
          ./build/desktop/radioscan --synctest FOLLOW 120 5 | tee follow.txt
          wait
          cat lead.txt
          grep -q "following 1" follow.txt
          grep -q "bpm 97.0" follow.txt
