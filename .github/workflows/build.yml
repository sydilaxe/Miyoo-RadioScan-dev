name: build

on:
  push:
  pull_request:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Publish a GitHub release with this tag (e.g. v0.1.0). Leave empty to just build."
        required: false
        default: ""

jobs:
  miyoo:
    name: Miyoo Mini Plus package
    runs-on: ubuntu-latest
    container: aemiii91/miyoomini-toolchain:latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          make package \
            CROSS=/opt/miyoomini-toolchain/usr/bin/arm-linux-gnueabihf- \
            SYSROOT=/opt/miyoomini-toolchain/usr/arm-linux-gnueabihf/sysroot
      - uses: actions/upload-artifact@v4
        with:
          name: RadioScan-miyoo
          path: dist/RadioScan/
      - uses: actions/upload-artifact@v4
        with:
          name: RadioScan-zip
          path: dist/RadioScan.zip

  release:
    name: Publish release
    # runs for: a pushed v* tag, a release created on the website, or a manual run with a tag filled in
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release' || inputs.release_tag != ''
    needs: [miyoo, desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Check the tag matches RS_VERSION
        env:
          TAG: ${{ inputs.release_tag || github.event.release.tag_name || github.ref_name }}
        run: |
          # the app compares the release tag with its own RS_VERSION; a mismatch would offer the update forever
          v=$(sed -n 's/^#define RS_VERSION "\([^"]*\)".*/\1/p' src/update.h)
          [ "$TAG" = "v$v" ] || { echo "::error::tag $TAG doesn't match RS_VERSION $v in src/update.h"; exit 1; }
      - uses: actions/download-artifact@v4
        with:
          name: RadioScan-zip
      - name: Create GitHub release with the Miyoo package
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag || github.event.release.tag_name || github.ref_name }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" RadioScan.zip --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" RadioScan.zip \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "RadioScan $TAG" \
              --notes-file .github/release-notes.md \
              --latest
          fi

  desktop:
    name: Desktop build + offline test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libsdl1.2-dev python3-numpy && pip install lameenc
      - run: make
      - name: Stream + synth test against a local fake Icecast server
        run: |
          python3 tools/fake_icecast.py --port 8765 &
          for i in $(seq 1 60); do curl -s -o /dev/null http://127.0.0.1:8765/list.pls && break; sleep 1; done
          mkdir -p t && cp App/RadioScan/cacert.pem t/
          printf 'Speech|http://127.0.0.1:8765/list.pls|voice\nMusic|http://127.0.0.1:8765/redirect|music\n' > t/stations.txt
          RADIOSCAN_DIR=t ./build/desktop/radioscan --render 8 t/out.wav 2>&1 | tee t/log.txt
          # one voice gets the talk stream and the other the music stream
          grep -q "voice sense .* (voice)" t/log.txt
          grep -q "voice sense .* (music)" t/log.txt
      - name: Self-update test against a local fake GitHub
        run: |
          mkdir -p rel/RadioScan && cp -r App/RadioScan/. rel/RadioScan/ && cp build/desktop/radioscan rel/RadioScan/
          echo 9.9.9 > rel/RadioScan/VERSION
          (cd rel && zip -qr RadioScan.zip RadioScan)
          python3 tools/fake_github.py rel --port 8767 --tag v9.9.9 &
          for i in $(seq 1 30); do curl -s -o /dev/null http://127.0.0.1:8767/latest.json && break; sleep 1; done
          mkdir -p u && cp App/RadioScan/cacert.pem u/ && echo 'Mine|http://example.com/mine|music' > u/stations.txt
          RS_UPDATE_API=http://127.0.0.1:8767/latest.json RADIOSCAN_DIR=u ./build/desktop/radioscan --update
          cmp u/radioscan rel/RadioScan/radioscan
          cmp u/launch.sh rel/RadioScan/launch.sh
          test "$(cat u/VERSION)" = 9.9.9
          test "$(cat u/stations.txt)" = 'Mine|http://example.com/mine|music'   # the user's stations are kept
          ! ls u/*.new 2>/dev/null
      - name: Wi-Fi sync test (two units on this machine)
        run: |
          ./build/desktop/radioscan --synctest LEAD 97 6 > lead.txt &
          sleep 0.5
          ./build/desktop/radioscan --synctest FOLLOW 120 5 | tee follow.txt
          wait
          cat lead.txt
          grep -q "following 1" follow.txt
          grep -q "bpm 97.0" follow.txt
